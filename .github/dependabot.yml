version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Keep VS Code types at or below the minimum supported engine version.
      - dependency-name: "@types/vscode"
        versions: [">=1.124.0"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
